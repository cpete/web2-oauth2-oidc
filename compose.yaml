services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - .:/workspaces/web2-oauth2-oidc
      - ./auth/realm.json:/opt/keycloak/data/import/realm.json:ro

  todo-api:
    build: ./api
    environment:
      PORT: "3001"
      # Issuer as it appears in the token (browser clients talk to localhost).
      OIDC_ISSUER: http://localhost:8080/realms/workshop
      # Signing keys are fetched over the Compose network, not via localhost.
      OIDC_JWKS_URI: http://keycloak:8080/realms/workshop/protocol/openid-connect/certs
      API_AUDIENCE: workshop-api
    ports:
      - "3001:3001"
    depends_on:
      - keycloak

  # A curl + jq box for exercising the client credentials grant by hand.
  # It stays running; open a shell with `docker compose exec client bash`, or
  # run the guided walkthrough with `docker compose exec client client-credentials`.
  client:
    build: ./client
    environment:
      TOKEN_URL: http://keycloak:8080/realms/workshop/protocol/openid-connect/token
      API_BASE: http://todo-api:3001
      CLIENT_ID: worker
      CLIENT_SECRET: dev-worker-secret-not-for-production
      SCOPE: todo.read
      # Mint tokens whose issuer matches what todo-api expects (see the script).
      ISSUER_HOST: localhost:8080
    depends_on:
      - keycloak
      - todo-api
