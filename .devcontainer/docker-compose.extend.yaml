# Devcontainer-only overrides for the `webapp` service:
#   * build a dev image (node:22-alpine + git/bash/libstdc++) so the VS Code
#     Server and everyday tooling work
#   * mount the repo at the workspace folder
#   * idle the container so VS Code owns the process instead of
#     `node dist/server.js`
# Plain `docker compose up` with the root compose.yaml is unaffected.
services:
  webapp:
    build:
      context: .devcontainer
      dockerfile: webapp.Dockerfile
    image: web2-oauth2-oidc-webapp-dev
    command: sleep infinity
    volumes:
      - .:/workspaces/web2-oauth2-oidc:cached
