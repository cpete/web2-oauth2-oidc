# Devcontainer-only override: build the keycloak image with tar/gzip added so
# the VS Code Server can install into the container. Plain `docker compose up`
# with the root compose.yaml is unaffected.
services:
  keycloak:
    # context is resolved relative to the project directory (where compose.yaml
    # lives), not this file.
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: web2-oauth2-oidc-keycloak-dev
