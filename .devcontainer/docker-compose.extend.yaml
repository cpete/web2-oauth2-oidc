# Devcontainer-only overrides for the `client` service: build it with the extra
# bits the VS Code Server needs (libstdc++, git — the alpine base omits them)
# and mount the repo as the workspace. Plain `docker compose up` with the root
# compose.yaml is unaffected.
services:
  client:
    # context is resolved relative to the project directory (where compose.yaml
    # lives), not this file.
    build:
      context: .
      dockerfile: .devcontainer/client.Dockerfile
    image: web2-oauth2-oidc-client-dev
    volumes:
      - .:/workspaces/web2-oauth2-oidc
